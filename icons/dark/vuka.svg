<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
<svg x="2" y="2" width="12" height="12" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8662C"/>
      <stop offset="1" stop-color="#9E2F16"/>
    </linearGradient>
    <!-- silhouette used for the white sticker border -->
    <g id="sil">
      <path d="M104 84 C68 98 40 76 68 50"/>
      <path d="M152 84 C188 98 216 76 188 50"/>
      <ellipse cx="80" cy="104" rx="20" ry="11" transform="rotate(20 80 104)"/>
      <ellipse cx="176" cy="104" rx="20" ry="11" transform="rotate(-20 176 104)"/>
      <path d="M128 64 C168 64 180 92 176 122 C172 150 168 168 166 186 C164 206 148 214 128 214 C108 214 92 206 90 186 C88 168 84 150 80 122 C76 92 88 64 128 64 Z"/>
      <path d="M108 206 L112 232 L120 218 L128 238 L136 218 L144 232 L148 206 Z"/>
    </g>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <g transform="translate(128 134) scale(.86) translate(-128 -142)">
    <!-- sticker border -->
    <use href="#sil" fill="#FFF4E2" stroke="#FFF4E2" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- horns: black outline + cream core -->
    <g fill="none" stroke-linecap="round">
      <path d="M104 84 C68 98 40 76 68 50" stroke="#1A1210" stroke-width="20"/>
      <path d="M152 84 C188 98 216 76 188 50" stroke="#1A1210" stroke-width="20"/>
      <path d="M104 84 C68 98 40 76 68 50" stroke="#E9D9BE" stroke-width="10"/>
      <path d="M152 84 C188 98 216 76 188 50" stroke="#E9D9BE" stroke-width="10"/>
    </g>

    <!-- ears -->
    <g fill="#6E5446" stroke="#1A1210" stroke-width="6">
      <ellipse cx="80" cy="104" rx="20" ry="11" transform="rotate(20 80 104)"/>
      <ellipse cx="176" cy="104" rx="20" ry="11" transform="rotate(-20 176 104)"/>
    </g>

    <!-- beard -->
    <path d="M108 206 L112 232 L120 218 L128 238 L136 218 L144 232 L148 206 Z" fill="#2B201B" stroke="#1A1210" stroke-width="6" stroke-linejoin="round"/>

    <!-- head -->
    <path d="M128 64 C168 64 180 92 176 122 C172 150 168 168 166 186 C164 206 148 214 128 214 C108 214 92 206 90 186 C88 168 84 150 80 122 C76 92 88 64 128 64 Z" fill="#6E5446" stroke="#1A1210" stroke-width="6"/>

    <!-- lighter face blaze -->
    <path d="M128 92 C142 92 146 120 146 150 C146 166 140 172 128 172 C116 172 110 166 110 150 C110 120 114 92 128 92 Z" fill="#8A6B5A"/>

    <!-- mane tuft -->
    <path d="M104 76 L110 54 L119 70 L128 48 L137 70 L146 54 L152 76 Z" fill="#2B201B" stroke="#1A1210" stroke-width="5" stroke-linejoin="round"/>

    <!-- muzzle -->
    <ellipse cx="128" cy="190" rx="34" ry="22" fill="#A8897A" stroke="#1A1210" stroke-width="6"/>
    <ellipse cx="116" cy="188" rx="5" ry="6" fill="#1A1210"/>
    <ellipse cx="140" cy="188" rx="5" ry="6" fill="#1A1210"/>
    <path d="M118 202 Q128 207 138 202" fill="none" stroke="#1A1210" stroke-width="4" stroke-linecap="round"/>

    <!-- goofy eyes -->
    <circle cx="106" cy="126" r="17" fill="#FFFFFF" stroke="#1A1210" stroke-width="6"/>
    <circle cx="152" cy="123" r="14" fill="#FFFFFF" stroke="#1A1210" stroke-width="6"/>
    <circle cx="109" cy="128" r="4.5" fill="#1A1210"/>
    <circle cx="149" cy="124" r="4.5" fill="#1A1210"/>
  </g>
</svg>
</svg>
